<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 00xy Sakura - Get Your Key</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: linear-gradient(145deg, #101016, #16161a);
            border: 1px solid rgba(244, 137, 190, 0.15);
            border-radius: 24px;
            padding: 40px 35px 35px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .title { color: #f8f2f7; font-size: 24px; font-weight: 800; }
        .title span { background: linear-gradient(135deg, #f489be, #ffb6c1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #a497a2; font-size: 12px; margin-top: 4px; }
        
        .youtube-section {
            background: rgba(255,0,0,0.05);
            border: 1px solid rgba(255,0,0,0.1);
            border-radius: 12px;
            padding: 16px;
            margin: 20px 0;
        }
        .timer { font-size: 28px; font-weight: 700; color: #ffb6c1; margin: 8px 0; }
        .timer-btn {
            background: rgba(255,0,0,0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255,0,0,0.2);
            border-radius: 8px;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .timer-btn:hover:not(:disabled) { background: rgba(255,0,0,0.25); }
        .timer-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .timer-btn.done { background: rgba(112, 222, 157, 0.15); color: #70de9d; border-color: rgba(112, 222, 157, 0.2); }
        
        .key-container {
            background: #0a0a0e;
            border: 1px solid rgba(244, 137, 190, 0.2);
            border-radius: 14px;
            padding: 16px 20px;
            margin-top: 20px;
            display: none;
        }
        .key-container.show { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        .key-display {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            letter-spacing: 4px;
            background: transparent;
            border: none;
            width: 100%;
            text-align: center;
            outline: none;
        }
        .btn-copy {
            background: linear-gradient(135deg, #9b4974, #f489be);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: all 0.3s ease;
        }
        .btn-copy:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(244, 137, 190, 0.3); }
        .footer { color: #4a3a47; font-size: 9px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.03); padding-top: 14px; }
        .footer span { color: #f489be; }
        .status { color: #a497a2; font-size: 12px; margin-top: 12px; }
        .status.done { color: #70de9d; }
    </style>
</head>
<body>

<div class="card">
    <div style="font-size:42px;">🌸</div>
    <div class="title">00xy <span>Sakura</span></div>
    <div class="subtitle">🔑 Générateur de clé gratuit</div>
    
    <div class="youtube-section">
        <div style="font-size:32px;">📹</div>
        <div style="color:#f8f2f7;font-size:14px;font-weight:600;margin:4px 0;">Regardez la vidéo</div>
        <div style="color:#a497a2;font-size:11px;">Attendez 10 secondes pour débloquer votre clé</div>
        <div class="timer" id="timerDisplay">0s</div>
        <button class="timer-btn" id="watchBtn">▶ Regarder</button>
        <div class="status" id="statusText">⏳ En attente...</div>
    </div>
    
    <div class="key-container" id="keyContainer">
        <div style="color:#a497a2;font-size:10px;text-transform:uppercase;letter-spacing:2px;">🔑 Votre clé</div>
        <input type="text" class="key-display" id="keyDisplay" readonly>
        <button class="btn-copy" id="copyBtn">📋 Copier la clé</button>
    </div>
    
    <div class="footer">©2026 <span>Sakura Studios</span> • All Rights Reserved</div>
</div>

<script>
    // ============================================================
    // 1. FAUSSE VÉRIFICATION (timer 10s)
    // ============================================================
    
    let isWatching = false;
    let timeLeft = 0;
    const requiredTime = 10;
    let timerInterval = null;
    let isVerified = false;
    
    const timerDisplay = document.getElementById('timerDisplay');
    const watchBtn = document.getElementById('watchBtn');
    const statusText = document.getElementById('statusText');
    const keyContainer = document.getElementById('keyContainer');
    const keyDisplay = document.getElementById('keyDisplay');
    
    function startTimer() {
        if (isWatching) return;
        isWatching = true;
        timeLeft = 0;
        watchBtn.textContent = '⏳ Regardez...';
        watchBtn.disabled = true;
        statusText.textContent = '📹 Regardez la vidéo...';
        statusText.className = 'status';
        
        timerInterval = setInterval(() => {
            timeLeft++;
            timerDisplay.textContent = timeLeft + 's';
            
            if (timeLeft >= requiredTime) {
                clearInterval(timerInterval);
                isWatching = false;
                isVerified = true;
                watchBtn.textContent = '✅ Vérifié !';
                watchBtn.className = 'timer-btn done';
                statusText.textContent = '✅ Vidéo regardée ! Clé débloquée !';
                statusText.className = 'status done';
                
                generateAndShowKey();
            }
        }, 1000);
    }
    
    watchBtn.addEventListener('click', startTimer);
    
    // ============================================================
    // 2. GÉNÉRATION DE CLÉ (valeurs prédéfinies)
    // ============================================================
    
    // ⚠️ Ces clés doivent être IDENTIQUES dans l'UI Roblox
    const VALID_KEYS = [
        "SAKURA-2026",
        "SAKURA2026",
        "ABCD-1234-EFGH",
        "FREE-00XY",
        "DEMO-KEY",
        "X7K9-2P4M-8R3T",
        "S1K2-A3R4-U5T6",
        "P9R8-O7I6-U5Y4"
    ];
    
    function getRandomKey() {
        return VALID_KEYS[Math.floor(Math.random() * VALID_KEYS.length)];
    }
    
    function generateAndShowKey() {
        const key = getRandomKey();
        keyDisplay.value = key;
        keyContainer.classList.add('show');
        
        // Ajouter la clé dans l'URL pour référence
        const url = new URL(window.location);
        url.searchParams.set('key', key);
        window.history.pushState({}, '', url);
    }
    
    // ============================================================
    // 3. COPIE
    // ============================================================
    
    document.getElementById('copyBtn').addEventListener('click', function() {
        const key = keyDisplay.value;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(key).then(() => {
                this.textContent = '✅ Copié !';
                this.style.background = 'linear-gradient(135deg, #70de9d, #4a9e6a)';
                setTimeout(() => {
                    this.textContent = '📋 Copier la clé';
                    this.style.background = '';
                }, 2000);
            });
        } else {
            // Fallback
            const textarea = document.createElement('textarea');
            textarea.value = key;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            this.textContent = '✅ Copié !';
            setTimeout(() => {
                this.textContent = '📋 Copier la clé';
            }, 2000);
        }
    });
    
    // ============================================================
    // 4. RÉCUPÉRER LA CLÉ DEPUIS L'URL
    // ============================================================
    
    const urlParams = new URLSearchParams(window.location.search);
    const urlKey = urlParams.get('key');
    if (urlKey && VALID_KEYS.includes(urlKey)) {
        keyDisplay.value = urlKey;
        keyContainer.classList.add('show');
        document.getElementById('statusText').textContent = '✅ Clé chargée depuis l\'URL !';
        document.getElementById('statusText').className = 'status done';
        document.getElementById('watchBtn').className = 'timer-btn done';
        document.getElementById('watchBtn').textContent = '✅ Vérifié !';
    }
</script>
</body>
</html>
