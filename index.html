<style>
* {
    box-sizing: border-box;

    padding: 0;
}

body {

h1 {

}

h1 span {

.subtitle {

}

.verify {
    margin-top: 25px;
    padding: 20px;

    background: rgba(255,255,255,.025);

    border: 1px solid rgba(255,255,255,.05);
    border-radius: 17px;
}

.icon {
    font-size: 27px;
}

h2 {
    margin-top: 8px;
    font-size: 14px;
}

.description {
    margin-top: 6px;

}

.timer {
    margin: 17px 0;

    color: #ffc2da;

    font-family: monospace;

}

.progress {
    height: 5px;
    overflow: hidden;

    margin-bottom: 15px;

    background: rgba(255,255,255,.05);
    border-radius: 99px;
}

.progress-bar {
    width: 0%;

    background:
        linear-gradient(
            90deg,

    transition: width .25s linear;
}

button {
    width: 100%;

    padding: 13px;

    font-size: 12px;
    font-weight: 750;

    border: 0;
    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #8d426b,
            #f489be
        );

    cursor: pointer;
    transition: .2s;
}

button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 30px rgba(244,137,190,.2);
}

button:disabled {
    opacity: .5;

}

.status {

}

    display: none;

    padding: 18px;

    border-radius: 17px;

    background: rgba(244,137,190,.05);
    border: 1px solid rgba(244,137,190,.13);
}

.key.show {
    display: block;
    animation: show .45s ease;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.label {

.back {

.back:hover {

<body>

<div class="card">

```
<div class="logo">🌸</div>

<h1>

<p class="subtitle">

<div class="verify">

</div>

    </button>

</div>


<a href="index.html" class="back">

```

</div>

<script>

const KEYS = [
    "SAKURA-2026",
    "SAKURA2026",
    "ABCD-1234-EFGH",
    "FREE-00XY",
    "DEMO-KEY",
    "X7K9-2P4M-8R3T"
];

const REQUIRED = 10;

let time = 0;
let interval = null;

const start =
    document.getElementById("start");

const timer =
    document.getElementById("timer");

const progress =
    document.getElementById("progress");

const status =
    document.getElementById("status");

const keyBox =
    document.getElementById("keyBox");

const key =
    document.getElementById("key");

const copy =
    document.getElementById("copy");


function randomKey() {

    return KEYS[
        Math.floor(
            Math.random() * KEYS.length
        )
    ];

}


function update() {

    timer.textContent =
        `${time}s`;

    progress.style.width =
        `${(time / REQUIRED) * 100}%`;

}


start.addEventListener("click", () => {

    if (interval) return;

    time = 0;

    start.disabled = true;
    start.textContent = "⏳ Vérification...";

    status.textContent =
        "📹 Vérification en cours...";

    interval = setInterval(() => {

        time++;

        update();

        if (time >= REQUIRED) {

            clearInterval(interval);
            interval = null;

            progress.style.width = "100%";

            start.textContent =
                "✓ Vérifié";

            status.textContent =
                "✓ Vérification terminée !";

            status.className =
                "status done";

            key.textContent =
                randomKey();

            keyBox.classList.add("show");
        }

    }, 1000);

});


copy.addEventListener("click", async () => {

    try {

        await navigator.clipboard.writeText(
            key.textContent
        );

        copy.textContent =
            "✓ Copié !";

        setTimeout(() => {
            copy.textContent =
                "📋 Copier la clé";
        }, 2000);

    } catch {

        const area =
            document.createElement("textarea");

        area.value =
            key.textContent;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        copy.textContent =
            "✓ Copié !";
    }

});

</script>
