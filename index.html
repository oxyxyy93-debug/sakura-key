<script>
    "use strict";

    const REQUIRED_TIME = 10;

    let elapsed = 0;
    let timer = null;
    let verified = false;

    const timerDisplay =
        document.getElementById("timerDisplay");

    const watchBtn =
        document.getElementById("watchBtn");

    const statusText =
        document.getElementById("statusText");

    const progressBar =
        document.getElementById("progressBar");

    const keyContainer =
        document.getElementById("keyContainer");

    const keyDisplay =
        document.getElementById("keyDisplay");

    const copyBtn =
        document.getElementById("copyBtn");


    /*
     * IMPORTANT :
     * Une clé présente uniquement dans le JavaScript
     * n'est pas une vraie sécurité.
     *
     * Pour un vrai système de clés, la génération/
     * validation doit être faite côté serveur.
     */

    const VALID_KEYS = [
        "SAKURA-2026",
        "SAKURA2026",
        "ABCD-1234-EFGH",
        "FREE-00XY",
        "DEMO-KEY",
        "X7K9-2P4M-8R3T",
        "S1K2-A3R4-U5T6",
        "P9R8-O7I6-U5Y4"
    ];


    function getRandomKey() {
        const index =
            Math.floor(Math.random() * VALID_KEYS.length);

        return VALID_KEYS[index];
    }


    function updateProgress() {

        const percentage =
            Math.min(
                (elapsed / REQUIRED_TIME) * 100,
                100
            );

        timerDisplay.textContent =
            `${elapsed}s`;

        progressBar.style.width =
            `${percentage}%`;
    }


    function startTimer() {

        if (timer || verified) {
            return;
        }

        elapsed = 0;
        updateProgress();

        watchBtn.disabled = true;
        watchBtn.textContent = "⏳ Vérification...";

        statusText.textContent =
            "📹 Vérification en cours...";

        statusText.className = "status";

        timer = setInterval(() => {

            elapsed++;

            updateProgress();

            if (elapsed >= REQUIRED_TIME) {

                clearInterval(timer);
                timer = null;

                completeVerification();
            }

        }, 1000);
    }


    function completeVerification() {

        verified = true;

        watchBtn.disabled = true;
        watchBtn.textContent = "✓ Vérifié";
        watchBtn.className = "timer-btn done";

        statusText.textContent =
            "✓ Vérification terminée — clé débloquée !";

        statusText.className = "status done";

        generateKey();
    }


    function generateKey() {

        const key = getRandomKey();

        keyDisplay.value = key;

        keyContainer.classList.add("show");

        /*
         * On ne place volontairement PAS la clé
         * dans l'URL : sinon n'importe qui peut
         * modifier ?key=... manuellement.
         */
    }


    watchBtn.addEventListener(
        "click",
        startTimer
    );


    copyBtn.addEventListener(
        "click",
        async () => {

            const key = keyDisplay.value;

            if (!key) {
                return;
            }

            try {

                await navigator.clipboard.writeText(key);

                copyBtn.textContent =
                    "✓ Clé copiée !";

                setTimeout(() => {

                    copyBtn.textContent =
                        "📋 Copier la clé";

                }, 2000);

            } catch {

                keyDisplay.select();

                document.execCommand("copy");

                copyBtn.textContent =
                    "✓ Clé copiée !";

                setTimeout(() => {

                    copyBtn.textContent =
                        "📋 Copier la clé";

                }, 2000);
            }
        }
    );
</script>
